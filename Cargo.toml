[package]
name = "qubit-utils"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
autotests = false
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-utils"
description = "General-purpose utilities for Rust projects"
homepage = "https://qubit-ltd.github.io/rs-utils/"
documentation = "https://docs.rs/qubit-utils"
readme = "README.md"
keywords = ["utilities", "qubit"]
categories = ["rust-patterns"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[package.metadata.rs-ci]
miri = true

[dependencies]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[[test]]
name = "tests"
path = "tests/mod.rs"

[[bench]]
name = "unchecked_slice"
harness = false
